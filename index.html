<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RP BAIANO (4GOD | 𝑽𝑩𝑨) — Loja Oficial</title>
  <style>
    body { background:#090b10; color:#f3f4f6; font-family:system-ui,sans-serif; margin:0; padding:0 0 50px; }
    .top { background:linear-gradient(90deg,#1d4ed8,#dc2626); color:#fff; text-align:center; padding:8px; font-size:12px; font-weight:700; }
    header { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 16px; background:#111622; border-bottom:1px solid #232d42; flex-wrap:wrap; }
    .brand { font-weight:900; font-size:15px; display:flex; align-items:center; gap:8px; }
    .tag { background:#2563eb; color:#fff; padding:4px 8px; border-radius:6px; font-size:11px; }
    button { cursor:pointer; border:none; border-radius:8px; font-weight:700; }
    .btn-sec { background:#182032; color:#fff; border:1px solid #2b3752; padding:8px 10px; font-size:12px; }
    .btn-cart { background:#2563eb; color:#fff; padding:8px 12px; font-size:12px; }
    .wrap { max-width:1060px; margin:0 auto; padding:16px; }
    .hero { background:#121724; border:1px solid #232d42; border-radius:14px; padding:16px; margin-bottom:14px; }
    .hero h1 { font-size:22px; margin:0 0 6px; }
    .hero p { font-size:13px; color:#cbd5e1; margin:0; }
    .filters { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:14px; }
    .fbtn { background:#121724; color:#94a3b8; border:1px solid #232d42; padding:8px 12px; font-size:12px; white-space:nowrap; }
    .fbtn.active { background:#2563eb; color:#fff; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
    .card { background:#121724; border:1px solid #232d42; border-radius:14px; padding:14px; display:flex; flex-direction:column; justify-content:space-between; gap:10px; }
    .price { font-size:18px; font-weight:900; color:#34d399; }
    .card h3 { font-size:16px; margin:6px 0 2px; }
    .sub { font-size:12px; color:#94a3b8; }
    .perks { list-style:none; padding:0; margin:8px 0 0; font-size:12px; color:#cbd5e1; }
    .perks li::before { content:"✓ "; color:#34d399; }
    .btn-buy { background:#5865f2; color:#fff; width:100%; padding:9px; font-size:12px; margin-bottom:6px; }
    .btn-add { background:#182032; color:#e2e8f0; border:1px solid #232d42; width:100%; padding:8px; font-size:12px; }
    .mbg { position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; padding:14px; z-index:50; }
    .mbg.open { display:flex; }
    .modal { background:#121724; border:1px solid #232d42; border-radius:14px; width:100%; max-width:440px; padding:16px; max-height:88vh; overflow-y:auto; }
    .mhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .xbtn { background:#263047; color:#fff; width:28px; height:28px; }
    label { display:block; font-size:12px; margin:8px 0 4px; color:#cbd5e1; }
    input { width:100%; box-sizing:border-box; background:#090b10; color:#fff; border:1px solid #232d42; border-radius:8px; padding:9px; font-size:13px; }
    pre { background:#090b10; border:1px solid #232d42; border-radius:8px; padding:10px; font-size:12px; white-space:pre-wrap; margin:10px 0; }
    .citem { display:flex; justify-content:space-between; align-items:center; background:#090b10; border:1px solid #232d42; border-radius:8px; padding:8px; margin-bottom:8px; font-size:12px; }
    .toast { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700; display:none; z-index:80; }
    .toast.show { display:block; }
  </style>
</head>
<body>
  <div class="top">🇧🇦 RP BAIANO (4GOD | 𝑽𝑩𝑨) • Ticket marca @4.god @dapraça @max</div>
  <header>
    <div class="brand"><span class="tag">4GOD</span><span>RP BAIANO • 𝑽𝑩𝑨</span></div>
    <div>
      <button class="btn-sec" onclick="openConfig()">⚙️ Discord</button>
      <button class="btn-cart" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <h1>Loja Oficial RP Baiano</h1>
      <p>Ao clicar em <strong>Comprar</strong>, copia o ticket marcando <strong>@4.god @dapraça @max</strong> e abre o Discord.</p>
    </section>
    <div class="filters">
      <button class="fbtn active" onclick="filterItems('all',this)">Todos (8)</button>
      <button class="fbtn" onclick="filterItems('vip',this)">👑 VIPs</button>
      <button class="fbtn" onclick="filterItems('favela',this)">🏚️ Favelas</button>
      <button class="fbtn" onclick="filterItems('servico',this)">⚠️ Retirar ADV</button>
    </div>
    <section id="catalog" class="grid"></section>
  </main>
  <div id="buyModal" class="mbg"><div class="modal"><div class="mhead"><strong>🤖 Ticket Discord</strong><button class="xbtn" onclick="closeM('buyModal')">✕</button></div><label>Nick Roblox</label><input id="nickRoblox" oninput="updTicket()" placeholder="Ex: CriaBaiano_4GOD" /><label>@ Discord</label><input id="userDiscord" oninput="updTicket()" placeholder="Ex: @cria4god" /><pre id="ticketText"></pre><button class="btn-buy" onclick="goTicket()">📋 Copiar & Abrir Discord</button></div></div>
  <div id="cartModal" class="mbg"><div class="modal"><div class="mhead"><strong>🛒 Carrinho</strong><button class="xbtn" onclick="closeM('cartModal')">✕</button></div><div id="cartList"></div><div id="cartTotal" style="font-weight:900;margin:10px 0;">Total: R$ 0,00</div><button class="btn-buy" onclick="checkout()">Finalizar Ticket (@4.god @dapraça @max)</button></div></div>
  <div id="configModal" class="mbg"><div class="modal"><div class="mhead"><strong>⚙️ Link do Discord</strong><button class="xbtn" onclick="closeM('configModal')">✕</button></div><label>Convite do Discord</label><input id="discInput" placeholder="https://discord.gg/..." /><button class="btn-buy" style="margin-top:12px;" onclick="saveDisc()">Salvar</button></div></div>
  <div id="toast" class="toast"></div>
    <script>
    const PRODUCTS = [
      { id:'adv', cat:'servico', badge:'⚠️ SERVIÇO', name:'RETIRAR ADV', sub:'Abra ticket pra resgatar', price:15, perks:['Remoção de ADV via ticket','Análise da staff'] },
      { id:'prata', cat:'vip', badge:'👑 VIP', name:'VIP PRATA', sub:'Plano inicial RP Baiano', price:15, perks:['Tag VIP Prata','Vantagens iniciais no RP'] },
      { id:'ouro', cat:'vip', badge:'👑 VIP', name:'VIP OURO', sub:'Vantagens intermediárias', price:25, perks:['Tag VIP Ouro','Benefícios ampliados'] },
      { id:'rubi', cat:'vip', badge:'💎 VIP', name:'VIP RUBI', sub:'Destaque na quebrada', price:35, perks:['Tag VIP Rubi','Vantagens extras no RP'] },
      { id:'esmeralda', cat:'vip', badge:'💚 VIP', name:'VIP ESMERALDA', sub:'Alto nível de vantagens', price:50, perks:['Tag VIP Esmeralda','Pacote avançado'] },
      { id:'diamante', cat:'vip', badge:'💠 VIP', name:'VIP DIAMANTE', sub:'Pacote VIP máximo', price:70, perks:['Tag VIP Diamante','Vantagens máximas'] },
      { id:'fav-p', cat:'favela', badge:'🏚️ FAVELA', name:'FAVELA PEQUENA', sub:'Comando de favela pequena', price:20, perks:['Espaço de favela pequena','Setup via ticket 4GOD'] },
      { id:'fav-g', cat:'favela', badge:'🏚️ FAVELA', name:'FAVELA GRANDE', sub:'Comando de favela grande', price:40, perks:['Espaço de favela grande','Maior porte via ticket 4GOD'] }
    ];
    let curCat='all', cart=JSON.parse(localStorage.getItem('vba_c')||'[]'), discUrl=localStorage.getItem('vba_d')||'https://discord.com/app', pending=[];
    const fmt = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const toast = m => { const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); };
    const closeM = id => document.getElementById(id).classList.remove('open');
    function filterItems(c,b){ curCat=c; document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active')); if(b)b.classList.add('active'); render(); }
    function render(){
      const list = curCat==='all'?PRODUCTS:PRODUCTS.filter(p=>p.cat===curCat);
      document.getElementById('catalog').innerHTML = list.map(p=>`
        <article class="card"><div><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:11px;font-weight:800;background:rgba(255,255,255,0.08);padding:3px 8px;border-radius:999px;">${p.badge}</span><span class="price">${fmt(p.price)}</span></div>
        <h3>${p.name}</h3><div class="sub">${p.sub}</div>
        <ul class="perks">${p.perks.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div><button class="btn-buy" onclick="buyOne('${p.id}')">Comprar (Abrir Ticket)</button>
        <button class="btn-add" onclick="addCart('${p.id}')">+ Carrinho</button></div></article>`).join('');
    }
    function addCart(id){ const p=PRODUCTS.find(x=>x.id===id), f=cart.find(x=>x.id===id); if(f)f.qty++; else cart.push({id:p.id,name:p.name,price:p.price,qty:1}); localStorage.setItem('vba_c',JSON.stringify(cart)); badge(); toast(p.name+' adicionado!'); }
    function chg(id,d){ const i=cart.find(x=>x.id===id); if(!i)return; i.qty+=d; if(i.qty<=0)cart=cart.filter(x=>x.id!==id); localStorage.setItem('vba_c',JSON.stringify(cart)); badge(); drawCart(); }
    function badge(){ document.getElementById('cartCount').textContent=cart.reduce((a,b)=>a+b.qty,0); }
    function openCart(){ drawCart(); document.getElementById('cartModal').classList.add('open'); }
    function drawCart(){
      const el=document.getElementById('cartList'), tot=document.getElementById('cartTotal');
      if(!cart.length){ el.innerHTML='<p style="color:#94a3b8;font-size:12px;">Carrinho vazio.</p>'; tot.textContent='Total: R$ 0,00'; return; }
      el.innerHTML=cart.map(i=>`<div class="citem"><div><strong>${i.name}</strong><br/><span style="color:#34d399;">${fmt(i.price*i.qty)}</span></div>
        <div style="display:flex;gap:6px;align-items:center;"><button class="xbtn" onclick="chg('${i.id}',-1)">-</button><span>${i.qty}</span><button class="xbtn" onclick="chg('${i.id}',1)">+</button></div></div>`).join('');
      tot.textContent='Total: '+fmt(cart.reduce((a,b)=>a+b.price*b.qty,0));
    }
    function checkout(){ if(!cart.length)return toast('Carrinho vazio!'); closeM('cartModal'); pending=[...cart]; updTicket(); document.getElementById('buyModal').classList.add('open'); }
    function buyOne(id){ const p=PRODUCTS.find(x=>x.id===id); pending=[{id:p.id,name:p.name,price:p.price,qty:1}]; updTicket(); document.getElementById('buyModal').classList.add('open'); }
    function updTicket(){
      const nick=document.getElementById('nickRoblox').value.trim()||'Não informado', disc=document.getElementById('userDiscord').value.trim()||'Não informado';
      const lines=pending.map(i=>`• ${i.name} (x${i.qty}) — ${fmt(i.price*i.qty)}`).join('\n');
      const total=pending.reduce((a,b)=>a+b.price*b.qty,0);
      document.getElementById('ticketText').textContent=`🎫 TICKET — RP BAIANO (4GOD | 𝑽𝑩𝑨)\nMarcados: @4.god @dapraça @max\n\n👤 Roblox: ${nick}\n💬 Discord: ${disc}\n🛒 Itens:\n${lines}\n💰 Total: ${fmt(total)}`;
    }
    function goTicket(){
      const txt=document.getElementById('ticketText').textContent;
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).catch(()=>{});
      toast('Copiado! Abrindo Discord...');
      setTimeout(()=>window.open(discUrl,'_blank','noopener,noreferrer'),350);
    }
    function openConfig(){ document.getElementById('discInput').value=discUrl==='https://discord.com/app'?'':discUrl; document.getElementById('configModal').classList.add('open'); }
    function saveDisc(){ discUrl=document.getElementById('discInput').value.trim()||'https://discord.com/app'; localStorage.setItem('vba_d',discUrl); closeM('configModal'); toast('Salvo!'); }
    render(); badge();
  </script>
</body>
</html>
